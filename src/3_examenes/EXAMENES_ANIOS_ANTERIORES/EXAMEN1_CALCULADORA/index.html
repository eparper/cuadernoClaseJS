<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/main.js" defer></script>
</head>
<body>

    <table>
      <tr>
        <td colspan="4"><textarea id="taResultado" rows="5" cols="30"></textarea></td>
      </tr>

      <tr>
        <td colspan="4">
          <input type="number" id="operando" style="width: 120px;" placeholder="op">
        </td>
      </tr>

      <tr>
        <td colspan="3">
          <input type="radio" name="versiones" id="versionBasica" checked><label for="versiones">Básica</label>
          <input type="radio" name="versiones" id="versionAvanzada"><label for="versiones">Avanzada</label>
        </td>
        <td>
          <input type="button" value="Limpiar">
        </td>
      </tr>

      <tr>
        <td id="tdOperacion1">
          <input type="button" value="+" class="botonOperacion">
        </td>
        <td id="tdOperacion2">
          <input type="button" value="-" class="botonOperacion">
        </td>
        <td id="tdOperacion3">
          <input type="button" value="x" class="botonOperacion">
        </td>
        <td id="tdOperacion4">
          <input type="button" value="/" class="botonOperacion">
        </td>
      </tr>

      <tr>
        <td id="tdOperacion5">
          <input type="button" value="√" class="botonOperacion">
        </td>
        <td id="tdOperacion6">
          
        </td>
        <td id="tdOperacion7">
          
        </td>
        <td>
          <input type="button" value="=" class="botonOperacion">
        </td>
      </tr>


    </table>

</body>
</html>
