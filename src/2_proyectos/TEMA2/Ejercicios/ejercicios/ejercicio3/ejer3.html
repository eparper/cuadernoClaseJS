<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="main3.js" defer></script>
    <style>
        input::placeholder {
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="documento">
        <h2>Ejercicio 3</h2><br>
        <p style="text-align: justify;">
            3. Crea una aplicación con JavaScript que, introducido por el usuario una cantidad en euros, 
            muestre la cantidad equivalente en dólares y yenes. Filtra errores para que solo se pueda 
            escribir un número entero o real.  
        </p><br>

        <input type="number" name="" id="cantidad" placeholder="€">
        <p id="dolares"></p>
        <p id="yenes"></p>
        <p style="color: red;" id="errores"></p>
    </div>
</body>
