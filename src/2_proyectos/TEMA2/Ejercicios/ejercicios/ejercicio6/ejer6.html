<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 6</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="main6.js" defer></script>
    <style>
        input::placeholder {
            text-align: right;

<body>
    <div class="documento">
        <h2>Ejercicio 6</h2><br>
        <p style="text-align: justify;">
            6. Desarrolla un script que pida dos números al usuario y muestre su suma, su resta, su 
            multiplicación, su división y el resto de la división. Recuerda que no se puede dividir 
            por cero y que todos deben ser números. 
        </p><br>

        <label for="num1">Número 1: </label>
        <input type="number" id="num1" name="num1">

        <label for="num2">Número 2: </label>
        <input type="number" id="num2" name="num2">

        <input type="button" id="bBoton" value="Calcular">

        <p id="resultados"></p>
        
        <p id="errores"></p>

    </div>
</body>
