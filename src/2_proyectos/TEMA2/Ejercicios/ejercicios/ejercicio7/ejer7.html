<!DOCTYPE html>

    <title>Ejercicio 7</title>

<body>
    <div class="documento">
        <h2>Ejercicio 7</h2><br>
        <p style="text-align: justify;">
            7. Desarrolla un script que pida tres notas, calcule su media aritmética e indique 
            la calificación del alumno usando la siguiente notación: 
            SUSPENSO (Menos de 5), 
            APROBADO (entre 5 y 7), 
            NOTABLE (entre 7 y 8.5), 
            SOBRESALIENTE (entre 8,5 y 10).  
        </p><br>

        <label for="nota1">Nota 1: </label>
        <input type="number" id="nota1" name="nota1"><br>

        <label for="nota2">Nota 2: </label>
        <input type="number" id="nota2" name="nota2"><br>

        <label for="nota3">Nota 3: </label>
        <input type="number" id="nota3" name="nota3"><br>

        <input type="button" id="bBoton" value="Calcular media">

        <p id="resultados"></p>
        
        <p id="errores"></p>

    </div>
</body>
</html>
